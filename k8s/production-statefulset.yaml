apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fsl-app-statefulset
  namespace: production
spec:
  serviceName: "fsl-app-service"
  replicas: 3
  selector:
    matchLabels:
      app: fsl-app
  template:
    metadata:
      labels:
        app: fsl-app
    spec:
      containers:
      - name: fsl-app
        image: fsl-devops-app:v1 # O la imagen que uses localmente
        ports:
        - containerPort: 3000 # Cambia al puerto interno de tu app Node.js si es distinto
---
apiVersion: v1
kind: Service
metadata:
  name: fsl-app-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: fsl-app
  ports:
    - port: 8080
      targetPort: 3000
      nodePort: 30081